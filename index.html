<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Opening Obsidian…</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 3em 1em; text-align: center; color: #222; background: #fff; }
    @media (prefers-color-scheme: dark) { body { color: #ddd; background: #111; } a { color: #9cf; } }
  </style>
</head>
<body>
  <!-- Forwards https://www.matejkala.com/obsidian-link/?vault=…&file=… to obsidian://open?vault=…&file=…
       so Obsidian links survive Google Calendar, which keeps only web links. -->
  <p id="status">Opening Obsidian… <a id="open">Open it manually</a></p>
  <script>
    // Forwards only vault and file, so a crafted link can't reach other open parameters such as path.
    var params = new URLSearchParams(location.search);
    var vault = params.get('vault');
    var file = params.get('file');
    if (vault && file) {
      var target = 'obsidian://open?vault=' + encodeURIComponent(vault) + '&file=' + encodeURIComponent(file);
      document.getElementById('open').href = target;
      location.replace(target);
    } else {
      document.getElementById('status').textContent = 'Not an Obsidian link.';
    }
  </script>
</body>
</html>
